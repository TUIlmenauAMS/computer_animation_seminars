[project]
name = "computeranimation-seminars"
version = "0.1.0"
description = "Computeranimation — Course Materials, TU Ilmenau AMS Group"
authors = [
    { name = "Renato Fera P.", email = "renato.profeta@tu-ilmenau.de" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
