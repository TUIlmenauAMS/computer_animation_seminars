[project]
name = "05-ca-pybullet-domino"
version = "0.1.0"
description = "Demo 05 — Domino Cascade · Computeranimation Chapter 05"
requires-python = "==3.12.*"
dependencies = [
    "PySide6>=6.7.0",
    "numpy>=1.26.0",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
# pybullet-arm64 ships pre-built wheels for Apple Silicon and ARM64 Windows.
# On x86_64 Linux / Windows use plain pybullet instead.
arm64 = [
    "pybullet-arm64>=3.2.7",
]
x86 = [
    "pybullet>=3.2.6",
]

[tool.uv]
# uv resolves the correct pybullet variant at sync time.
# Run:   uv sync --extra arm64     (Apple Silicon / ARM64 Windows)
#        uv sync --extra x86       (x86-64 Linux / Windows)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
